name: "Post 1 (Saturday): The Services Section"

on:
  workflow_dispatch:
  schedule:
    - cron: '00 14 28 3 *' # 14:00 UTC = 19:30 IST on March 28

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Publish to Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python .github/scripts/publish_action.py --folder "scheduled_posts/Post_01_The_Services_Section_Nobody_Fills_Out"

name: Instagram Scheduler

on:
  schedule:
    # Runs at 15:00 UTC (8:30 PM IST) on Tuesday, Thursday, and Saturday
    - cron: '0 15 * * 2,4,6'
  workflow_dispatch:
    # Allows manual triggering for testing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Instagram Scheduler
      env:
        IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
      run: python .github/scripts/auto_publish_queue.py

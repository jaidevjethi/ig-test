name: "Publish: retention_strategy"

on:
  schedule:
    - cron: '50 6 27 2 *' # Today on 27 Feb 2026 at 06:50 AM UTC (12:20 PM IST)
  workflow_dispatch:

jobs:
  publish_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Publish Post & Comment
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python scheduled_posts/retention_strategy/publish.py

      - name: Wait Before Cleanup
        run: sleep 300

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete Post Folder
        run: rm -rf scheduled_posts/retention_strategy

      - name: Commit Folder Deletion
        run: |
          git add scheduled_posts/retention_strategy
          git commit -m "chore(cleanup): Remove scheduled post folder after publishing" || true

      - name: Delete Workflow File
        run: rm -f .github/workflows/post_retention_strategy.yml

      - name: Commit Workflow Deletion & Push
        run: |
          git add .github/workflows/post_retention_strategy.yml
          git commit -m "chore(cleanup): Remove scheduled post workflow" || true
          git push origin main

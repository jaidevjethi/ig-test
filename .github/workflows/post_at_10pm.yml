name: Scheduled Instagram Post

on:
  schedule:
    # 22:42 IST = 17:12 UTC
    - cron: '12 17 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Show Current Time (Debug)
        run: date -u

      - name: Execute Publication Script
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          python scheduled_posts/patient_trust/publish.py

name: Post 'The One Rule' Carousel (9 AM IST)

on:
  schedule:
    - cron: '30 3 27 2 *' # 3:30 AM UTC = 9:00 AM IST on Feb 27
  workflow_dispatch:

jobs:
  publish_and_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Staging Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Publication
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python scheduled_posts/one_rule/publish.py

      - name: Success Wait & Post-Cleanup
        if: success()
        run: |
          echo "Post successful. Waiting 5 minutes for meta propagation before self-cleaning..."
          sleep 300
          
          # Remove post assets
          rm -rf scheduled_posts/one_rule
          
          # Git commit assets removal
          git config --global user.name "Anti-Gravity Autonomous"
          git config --global user.email "quadrantops@gmail.com"
          git add .
          git commit -m "chore: autonomous cleanup of published 'one_rule' assets"
          
          # Self-delete workflow
          rm .github/workflows/post_one_rule.yml
          git add .github/workflows/post_one_rule.yml
          git commit -m "chore: autonomous self-deletion of 'one_rule' workflow"
          
          git push origin main

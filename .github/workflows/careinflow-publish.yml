name: CareInflow publish

# Publishes whatever is due in careinflow/queue/. One permanent workflow: posts
# are queued as files, never as workflow files (the Actions token may not edit
# workflows, which is why the old per-post workflows failed at cleanup).
on:
  schedule:
    - cron: '0 2,3,4,5 * * *'   # 07:30–10:30 IST: early starts; the first to run waits for the 13:30 post
    - cron: '17 * * * *'        # hourly backstop: publishes anything overdue
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check the token and list the queue'
        type: boolean
        default: true
      wait_minutes:
        description: 'Wait up to this many minutes for the next queued post, then publish it'
        type: string
        default: '0'
      force_id:
        description: 'Publish this post ID now, whatever its date (e.g. M01-W01-CAROUSEL-01)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: careinflow-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish due posts
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_ID: ${{ inputs.force_id }}
          WAIT_MAX_MIN: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_minutes || '330' }}
        run: node careinflow/publish.mjs

      - name: Record what was published
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A careinflow
          if ! git diff --cached --quiet; then
            git commit -m "careinflow: published $(ls careinflow/published | tail -1 | sed 's/.json//')"
            # A waiting run may finish after new posts were queued: rebase, never drop the record.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi

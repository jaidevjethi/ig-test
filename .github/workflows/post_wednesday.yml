name: "Post 3 (Wednesday): Profile vs Reputation"

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 22 4 *' # 13:30 UTC = 19:00 IST on Wednesday April 22

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Publish to Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python .github/scripts/publish_action.py --folder "scheduled_posts/Post_03_The_Corporate_Takeover"
